<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>轻练 FIT · 健身记录</title>
<style>
:root{--bg:#0b101c;--panel:#131c2b;--panel2:#1b273a;--line:#2b3a51;--text:#f3f6fc;--sub:#9eafc5;--blue:#80b8ff;--aqua:#5ae2c2;--orange:#ffbd80;--red:#fd929b;--shadow:0 12px 30px #03091640}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -15%,#1c3550 0,transparent 35%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft Yahei',sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}.shell{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}.sidebar{background:#101826e8;border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:0 12px 30px;font-size:23px;font-weight:900;letter-spacing:.3px}.brandmark{display:grid;place-items:center;width:39px;height:39px;background:linear-gradient(135deg,var(--blue),var(--aqua));border-radius:13px;color:#081321;font-size:24px}.nav{display:grid;gap:8px}.navbtn{border:0;border-radius:13px;padding:13px 16px;display:flex;align-items:center;gap:12px;color:var(--sub);background:transparent;text-align:left;font-weight:650}.navbtn:hover{background:#223047;color:white}.navbtn.active{color:#081421;background:linear-gradient(90deg,var(--blue),#a3d2ff)}.sidehint{padding:17px 14px;line-height:1.6;color:var(--sub);font-size:12px;margin-top:24px;border:1px solid var(--line);border-radius:14px}.main{padding:34px clamp(18px,4vw,60px) 90px;max-width:1480px;width:100%;margin:auto}.pagebar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--aqua)}h1{font-size:clamp(25px,3vw,37px);margin:6px 0}h2{font-size:20px;margin:0 0 18px}h3{margin:0 0 10px;font-size:17px}.muted{color:var(--sub)}.small{font-size:12px}.lead{font-size:14px;color:var(--sub);margin:7px 0}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #486481;background:#20344c;color:#c7e1ff;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:700}.chip.green{border-color:#336a5c;background:#183c36;color:#86f1d0}.chip.warn{border-color:#7d5b3f;background:#433020;color:#ffd0a4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.cols2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:linear-gradient(145deg,var(--panel),#111a28);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.hero{background:linear-gradient(120deg,#183d54 0%,#192b46 60%,#172236 100%);border-color:#345a76}.heroTitle{font-size:clamp(23px,3vw,38px);font-weight:850;line-height:1.35;margin:10px 0}.stat{font-size:27px;font-weight:850;margin:8px 0}.statlabel{font-size:13px;color:var(--sub)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{height:16px}.btn{border:1px solid var(--line);background:#26364c;color:white;padding:11px 16px;border-radius:12px;font-weight:750;min-height:43px}.btn:hover{filter:brightness(1.12)}.btn.primary{background:linear-gradient(100deg,var(--blue),#a2d2ff);border-color:transparent;color:#091729}.btn.mint{background:var(--aqua);border:0;color:#092623}.btn.ghost{background:transparent}.btn.danger{background:#502b34;border-color:#79505a;color:#ffbdc6}.btn.sm{padding:6px 9px;font-size:12px;min-height:34px}.btn.block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{padding:8px 12px;border-radius:13px;background:#1c2b3d;color:#bdd0e5;font-size:13px}.list{display:grid;gap:11px}.exercise{background:#192537;border:1px solid #304159;padding:17px;border-radius:16px}.exTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{background:#294760;color:#a7ddff;border-radius:10px;padding:7px 10px;font-weight:900}.setrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:14px}.setbtn{border:1px solid #46607a;border-radius:10px;background:#26384e;color:white;padding:9px 11px;font-size:12px;min-width:44px}.setbtn.done{background:#175947;border-color:#388e78;color:#a7ffe0}.setinput{width:75px;text-align:center;background:#101c2d;border:1px solid #40536b;border-radius:8px;color:white;padding:8px 4px;font-size:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#bad0e6}.field input,.field select,.field textarea{width:100%;background:#0f1a2a;border:1px solid #40516a;padding:11px 12px;color:white;border-radius:10px;outline-color:var(--blue)}.field textarea{min-height:130px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.spaced{margin-top:15px}.divider{height:1px;background:var(--line);margin:20px 0}.note{padding:13px 15px;border:1px solid #37606b;border-radius:13px;background:#14303d;font-size:13px;color:#c3e9e5;line-height:1.7}.warning{padding:12px 15px;border:1px solid #74563a;border-radius:13px;background:#362719;font-size:13px;color:#f7d5aa}.empty{padding:28px;text-align:center;border:1px dashed #40516a;border-radius:15px;color:var(--sub)}.routine{display:grid;gap:10px}.daymini{display:flex;align-items:center;gap:12px;padding:13px;background:#182638;border:1px solid #354861;border-radius:12px}.daymini.current{border-color:var(--aqua)}.dot{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;background:#24435b;color:#b8d9f8;font-weight:900}.floatright{margin-left:auto}.bigicon{font-size:29px}.chart{width:100%;height:230px;border-radius:12px;background:#101b2a;border:1px solid #283950}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.photo{border-radius:12px;overflow:hidden;background:#152438;border:1px solid #3b4b60}.photo img{width:100%;height:170px;object-fit:cover;display:block}.photo .label{padding:8px;font-size:12px;color:var(--sub)}.bottomnav{display:none}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chat{height:310px;overflow:auto;padding:12px;border-radius:13px;background:#0d1726;border:1px solid #33475b;display:flex;flex-direction:column;gap:12px}.bubble{max-width:91%;padding:11px 13px;border-radius:15px;background:#26384c;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}.bubble.me{align-self:flex-end;background:#244f59}.bubble.ai{align-self:flex-start}.switch{appearance:none;width:47px;height:26px;border-radius:99px;background:#516075;position:relative;cursor:pointer;border:0;flex-shrink:0}.switch:checked{background:#4cc6ac}.switch:after{content:'';position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}.switch:checked:after{transform:translateX(21px)}.toast{position:fixed;right:22px;bottom:24px;background:#225446;color:white;padding:12px 18px;border-radius:12px;border:1px solid #468e7b;z-index:20;box-shadow:var(--shadow)}.minorheading{font-size:14px;font-weight:750;color:#b1c9e2;margin-bottom:8px}.foot{margin-top:30px;font-size:12px;color:#74889f}strong{color:#f6f8fc}.miniProgress{height:8px;background:#304157;border-radius:99px;overflow:hidden}.miniProgress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--aqua))}summary{cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calcell{background:#182638;border:1px solid #304156;border-radius:9px;min-height:49px;text-align:center;padding:6px 2px;font-size:12px;color:#b9cada}.calcell.done{background:#1b4b44;border-color:#2e9a7e}.calcell.rest{background:#4b3b29;border-color:#8e663e}.calcell.today{outline:1px solid var(--blue)}.calhead{font-size:11px;text-align:center;color:var(--sub);padding-bottom:7px}.textbtn{border:0;background:none;color:var(--blue);padding:4px}.mutedbar{font-size:12px;color:#8194ab;margin-top:8px} @media(max-width:950px){.shell{display:block}.sidebar{display:none}.main{padding:20px 16px 105px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101826ed;border-top:1px solid var(--line);padding:8px 4px max(8px,env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(12px)}.bottomnav .navbtn{font-size:10px;padding:8px 5px;flex-direction:column;gap:4px;min-width:49px;align-items:center}.bottomnav .navbtn span:first-child{font-size:19px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols2{grid-template-columns:1fr}}@media(max-width:560px){.grid,.split,.formgrid{grid-template-columns:1fr}.card{padding:17px}.heroTitle{font-size:25px}.pagebar{align-items:flex-start}.stat{font-size:24px}.exTop{align-items:start}.setinput{width:70px}.main{padding-left:12px;padding-right:12px}}
.bottomnav .navbtn{min-width:0;flex:1}.photo img{background:#0b101c}button:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}</style><link rel="stylesheet" href="training-details.css"><link rel="stylesheet" href="nutrition.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="meal-photo.css"></head><body><header id="fitAppBar" class="fit-appbar"><button class="textbtn" data-fit-mobile="back" aria-label="返回首页" hidden>‹ 返回</button><strong data-fit-app-title>轻练 FIT</strong><button class="btn sm" data-tab="settings">设置与备份</button></header><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">↗</div>轻练 <span style="color:var(--aqua)">FIT</span></div><nav class="nav" id="desktopNav"></nav><div class="sidehint">私人健身测试版 · v0.7.0<br>本地保存，不需要登录。<br>AI 默认关闭，不会自行调用付费接口。</div></aside><main class="main"><div id="app"></div></main></div><nav id="bottomNav" class="bottomnav"></nav><div id="toastbox"></div><script src="mobile-bootstrap.js"></script><script src="app.js"></script><script src="exercise-guides.js"></script><script src="training-details.js"></script><script src="food-database.js"></script><script src="nutrition.js"></script><script src="enhancements.js"></script><script src="mobile-app.js"></script>
